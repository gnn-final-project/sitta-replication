name: "funit"
num_iter: 100000
display_size: 8
vgg_model_path: "./models/vgg19.pth"

trainer: FUNIT
gen:
  nf: 64
  latent_dim: 8
  n_downs_class: 2
  n_downs_content: 2
  n_mlp_blks: 3
  n_res_blks: 4

dis:
  nf: 64
  n_layers: 4

train:
  lr: 0.0001
  batch_size: 8
  weight_decay: 0
  display_size: 8
  beta1: 0.5
  beta2: 0.999
  gan_w: 1.0
  recon_x_c_w: 10.0
  recon_s_w: 1.0
  recon_x_s_w: 1.0
  content_w: 1.0
  style_w: 1.0

data:
  dataset: "your_dataset"
  data_root: "./data"
  image_size: 128
  num_workers: 4
  